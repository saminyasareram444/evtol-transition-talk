<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Protected presentation</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url(vendor/fonts/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(vendor/fonts/inter-latin-600-normal.woff2) format("woff2"); }
  :root { --bg: #0b1020; --card: #121a33; --line: #26304f; --ink: #e7ecf7; --muted: #9aa6c4; --accent: #2ed3b7; --bad: #ff8a8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  form[hidden] { display: none; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
          border-radius: 8px; padding: 10px 12px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { margin-top: 16px; width: 100%; font: inherit; font-weight: 600; font-size: 15px; color: #06231e; background: var(--accent);
           border: 0; border-radius: 8px; padding: 11px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--bad); }
  .note { margin: 14px 0 0; font-size: 12px; }
</style>
</head>
<body>
<main>
  <form id="f" autocomplete="off" hidden>
    <h1>Protected presentation</h1>
    <p>Enter the password to open the slides.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" required>
    <button id="go" type="submit">Open slides</button>
    <div id="msg" role="alert"></div>
    <p class="note">The slides stay open in this tab until you close it.</p>
  </form>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const msg = (t) => { $("msg").textContent = t; };
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const tob64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  const ok = window.isSecureContext && "serviceWorker" in navigator && window.crypto && crypto.subtle && window.sessionStorage;
  const show = () => { $("f").hidden = false; $("pw").focus(); };
  function send(w, data) {
    return new Promise((resolve) => {
      const ch = new MessageChannel();
      ch.port1.onmessage = (e) => resolve(e.data);
      w.postMessage(data, [ch.port2]);
    });
  }
  async function open(raw, salt) {                       // hand the key and a one-time ticket to the worker, then open
    await navigator.serviceWorker.register("sw.js");
    const reg = await navigator.serviceWorker.ready;
    await send(reg.active, { type: "key", raw: raw, salt: salt });
    location.replace("deck.html" + location.hash);
  }
  async function check(key, meta) {
    const chk = b64(meta.check);
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: chk.slice(0, 12) }, key, chk.slice(12));
  }
  async function meta() { return (await fetch("lock.json", { cache: "no-cache" })).json(); }

  if (!ok) {
    show();
    msg("This browser cannot open the protected slides here. Please use a normal (not private) window of Chrome, Edge, Firefox or Safari.");
    $("go").disabled = true;
    return;
  }
  (async () => {                                         // this tab is already unlocked (e.g. a reload): continue
    const saved = sessionStorage.getItem("deck-key");
    if (!saved) return show();
    try {
      const [raw, salt] = saved.split("|"), m = await meta();
      if (salt !== m.salt) throw new Error("site rebuilt");
      const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", true, ["decrypt"]);
      await check(key, m);
      await open(b64(raw).buffer, salt);
    } catch (e) {
      sessionStorage.removeItem("deck-key");
      show();
    }
  })();

  $("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("go").disabled = true; msg("");
    try {
      const m = await meta();
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode($("pw").value), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(m.salt), iterations: m.iterations },
                                                base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      try { await check(key, m); } catch (e) {
        msg("Wrong password."); $("go").disabled = false; $("pw").select(); return;
      }
      const raw = await crypto.subtle.exportKey("raw", key);
      sessionStorage.setItem("deck-key", tob64(raw) + "|" + m.salt);
      await open(raw, m.salt);
    } catch (e) {
      msg("Could not open the slides: " + e.message); $("go").disabled = false;
    }
  });
})();
</script>
</body>
</html>
